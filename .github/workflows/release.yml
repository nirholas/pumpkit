name: Release

# Manual only. Changesets is not set up yet (no @changesets/cli, no
# .changeset/config.json), and `npx changeset` without the CLI installed
# resolves to an unrelated npm package named "changeset". Add the config,
# then run this workflow from the Actions tab.
on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Changesets release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a Changesets config
        run: |
          test -f .changeset/config.json || {
            echo "::error::.changeset/config.json is missing; run 'npx @changesets/cli init' and commit it first"
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck + Test
        run: |
          npm run typecheck
          npm run test

      - name: Create Release PR or publish to npm
        uses: changesets/action@v2
        with:
          publish: npx --yes --package=@changesets/cli@2.29.7 changeset publish
          version: npx --yes --package=@changesets/cli@2.29.7 changeset version
          commit: "chore: release packages"
          title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
