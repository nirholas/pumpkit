name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # vitest 5 and vite 8 need Node 22.12+; Node 20 reached end of life in April 2026.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check publishable tarballs
        run: |
          for ws in @pumpkit/core @pumpkit/channel @pumpkit/claim @pumpkit/tracker; do
            npm pack --dry-run --workspace "$ws" > /dev/null
          done
