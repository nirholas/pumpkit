version: 2

updates:
  # Root + each workspace package
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      typescript-tooling:
        patterns:
          - "typescript"
          - "tsx"
          - "vitest"
          - "@types/*"
      solana:
        patterns:
          - "@solana/*"
          - "@nirholas/pump-sdk"
      bot-runtime:
        patterns:
          - "grammy"
          - "grammy-*"
    ignore:
      # web3.js 2.x+ is a different API (built on @solana/kit). Both pump SDKs
      # depend on web3.js 1.x and their types must match ours, so majors are
      # a manual migration, not a dependency bump.
      - dependency-name: "@solana/web3.js"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
